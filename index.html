<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Underwood - Trick or Treat Wheel 🎃👻</title>
    <style>
        @import url("https://fonts.googleapis.com/css2?family=Creepster&display=swap");

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background: #030108;
            background-image: 
                radial-gradient(circle at 50% 15%, rgba(239, 68, 68, 0.45) 0%, transparent 55%),
                radial-gradient(circle at 15% 85%, rgba(34, 197, 94, 0.3) 0%, transparent 50%),
                radial-gradient(circle at 85% 85%, rgba(168, 85, 247, 0.3) 0%, transparent 50%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 16px 12px;
            overflow: hidden;
            position: relative;
            gap: 12px;
        }

        /* 🩸 КРИВАВИЙ ЗАГОЛОВОК */
        .bloody-title {
            font-family: "Creepster", cursive, sans-serif !important;
            color: #dc2626 !important;
            text-transform: uppercase;
            letter-spacing: 3px;
            font-size: clamp(2.2rem, 6.5vw, 3.8rem);
            line-height: 1.1;
            -webkit-text-stroke: 1px #450a0a;
            animation: intenseBloodPulse 2s ease-in-out infinite alternate;
        }

        @keyframes intenseBloodPulse {
            0% {
                text-shadow: 
                    0 0 5px rgba(220, 38, 38, 0.8),
                    0 0 12px rgba(185, 28, 28, 0.6),
                    0 2px 4px #000000;
            }
            100% {
                text-shadow: 
                    0 0 12px rgba(255, 0, 0, 1),
                    0 0 25px rgba(239, 68, 68, 0.9),
                    0 0 40px rgba(34, 197, 94, 0.7),
                    0 4px 8px #000000;
            }
        }

        /* 🕸️ ПАВУТИНА У КУТКАХ */
        .web-corner {
            position: absolute;
            font-size: clamp(2.5rem, 4vw, 4rem);
            opacity: 0.35;
            pointer-events: none;
            z-index: 2;
            line-height: 1;
        }
        .web-tl { top: 6px; left: 6px; }
        .web-tr { top: 6px; right: 6px; transform: scaleX(-1); }
        .web-bl { bottom: 6px; left: 6px; transform: scaleY(-1); }
        .web-br { bottom: 6px; right: 6px; transform: scale(-1); }

        /* 👻 ЖАХАСТИКИ (Z-INDEX: 1 — ПРОЛІТАЮТЬ ЗА КОЛЕСОМ І КНОПКОЮ ПО ВСЬОМУ ЕКРАНУ) */
        .spooky-float {
            position: absolute;
            pointer-events: none;
            z-index: 1;
            opacity: 0.45;
            filter: drop-shadow(0 0 8px rgba(239, 68, 68, 0.8));
            animation: floatFullArea 10s ease-in-out infinite alternate;
        }

        /* РІЗНОМАНІТНІ ШВИДКОСТІ ТА НАПРЯМКИ ДЛЯ 30+ ЖАХАСТИКІВ */
        .sp-1  { top: 5%;  left: 5%;  font-size: 2.8rem; animation-duration: 7s; }
        .sp-2  { top: 12%; left: 85%; font-size: 3.2rem; animation-duration: 9s; animation-direction: alternate-reverse; }
        .sp-3  { top: 20%; left: 45%; font-size: 2.6rem; animation-duration: 8s; }
        .sp-4  { top: 28%; left: 15%; font-size: 3.0rem; animation-duration: 11s; animation-direction: alternate-reverse; }
        .sp-5  { top: 35%; left: 75%; font-size: 3.4rem; animation-duration: 6.5s; }
        .sp-6  { top: 42%; left: 5%;  font-size: 2.7rem; animation-duration: 10s; }
        .sp-7  { top: 50%; left: 90%; font-size: 3.1rem; animation-duration: 8.5s; animation-direction: alternate-reverse; }
        .sp-8  { top: 58%; left: 30%; font-size: 2.9rem; animation-duration: 7.5s; }
        .sp-9  { top: 65%; left: 65%; font-size: 3.3rem; animation-duration: 9.5s; }
        .sp-10 { top: 72%; left: 10%; font-size: 2.8rem; animation-duration: 12s; animation-direction: alternate-reverse; }
        .sp-11 { top: 80%; left: 80%; font-size: 3.5rem; animation-duration: 7s; }
        .sp-12 { top: 88%; left: 40%; font-size: 2.7rem; animation-duration: 10.5s; }
        
        .sp-13 { top: 8%;  left: 60%; font-size: 3.1rem; animation-duration: 8.2s; }
        .sp-14 { top: 15%; left: 28%; font-size: 2.5rem; animation-duration: 6.8s; animation-direction: alternate-reverse; }
        .sp-15 { top: 25%; left: 92%; font-size: 2.9rem; animation-duration: 9.2s; }
        .sp-16 { top: 38%; left: 35%; font-size: 3.2rem; animation-duration: 11.5s; }
        .sp-17 { top: 48%; left: 70%; font-size: 2.8rem; animation-duration: 7.8s; animation-direction: alternate-reverse; }
        .sp-18 { top: 55%; left: 18%; font-size: 3.0rem; animation-duration: 8.8s; }
        .sp-19 { top: 68%; left: 82%; font-size: 2.6rem; animation-duration: 10.2s; }
        .sp-20 { top: 78%; left: 52%; font-size: 3.4rem; animation-duration: 6.2s; animation-direction: alternate-reverse; }
        
        .sp-21 { top: 3%;  left: 30%; font-size: 2.9rem; animation-duration: 9s; }
        .sp-22 { top: 18%; left: 70%; font-size: 3.3rem; animation-duration: 7.4s; }
        .sp-23 { top: 32%; left: 50%; font-size: 2.7rem; animation-duration: 10.8s; animation-direction: alternate-reverse; }
        .sp-24 { top: 45%; left: 12%; font-size: 3.1rem; animation-duration: 8.6s; }
        .sp-25 { top: 62%; left: 42%; font-size: 2.8rem; animation-duration: 6.9s; }
        .sp-26 { top: 75%; left: 25%; font-size: 3.5rem; animation-duration: 11.2s; animation-direction: alternate-reverse; }
        .sp-27 { top: 84%; left: 95%; font-size: 2.6rem; animation-duration: 8.1s; }
        .sp-28 { top: 92%; left: 15%; font-size: 3.0rem; animation-duration: 9.7s; }
        .sp-29 { top: 10%; left: 95%; font-size: 2.8rem; animation-duration: 7.3s; }
        .sp-30 { top: 52%; left: 98%; font-size: 3.2rem; animation-duration: 10.1s; animation-direction: alternate-reverse; }

        @keyframes floatFullArea {
            0% {
                transform: translate(-40px, -30px) rotate(-12deg) scale(0.9);
                opacity: 0.3;
            }
            50% {
                transform: translate(60px, 40px) rotate(10deg) scale(1.1);
                opacity: 0.65;
            }
            100% {
                transform: translate(-50px, 60px) rotate(-8deg) scale(0.95);
                opacity: 0.35;
            }
        }

        header {
            text-align: center;
            z-index: 5;
            position: relative;
        }

        p.subtitle {
            color: #4ade80;
            font-size: clamp(0.72rem, 2.6vw, 1.1rem);
            text-shadow: 0 0 8px rgba(74, 222, 128, 0.6);
            font-weight: 600;
            margin-top: 4px;
        }

        /* 🔮 ПЛАШКА СПРОБ З ПУЛЬСАЦІЄЮ */
        .attempts-badge {
            background: rgba(239, 68, 68, 0.22);
            border: 1px solid #ef4444;
            color: #fca5a5;
            padding: 6px 18px;
            border-radius: 20px;
            font-size: clamp(0.75rem, 2.2vw, 1rem);
            font-weight: bold;
            z-index: 5;
            animation: intenseBadgeGlow 1.8s ease-in-out infinite alternate;
        }

        @keyframes intenseBadgeGlow {
            0% {
                box-shadow: 0 0 6px rgba(239, 68, 68, 0.4);
                border-color: #ef4444;
            }
            100% {
                box-shadow: 0 0 22px rgba(239, 68, 68, 1), 0 0 10px rgba(254, 202, 202, 0.8);
                border-color: #fca5a5;
            }
        }

        /* 🎯 КОНТЕЙНЕР КОЛЕСА З ПІДСВІТКОЮ */
        .wheel-container {
            position: relative;
            width: min(80vw, 42vh, 340px);
            height: min(80vw, 42vh, 340px);
            margin: 8px auto;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 5;
            border-radius: 50%;
            animation: intenseWheelGlow 2.5s ease-in-out infinite alternate;
        }

        @keyframes intenseWheelGlow {
            0% {
                box-shadow: 0 0 20px rgba(239, 68, 68, 0.5), 0 0 12px rgba(34, 197, 94, 0.4);
            }
            100% {
                box-shadow: 0 0 45px rgba(239, 68, 68, 0.95), 0 0 30px rgba(34, 197, 94, 0.8), inset 0 0 20px rgba(168, 85, 247, 0.5);
            }
        }

                width: min(65vw, 52vh, 480px);
                height: min(65vw, 52vh, 480px);

            .eye-pupil { width: 12px !important; height: 12px !important; }

                border-right-width: 18px !important;
                border-top-width: 32px !important;
